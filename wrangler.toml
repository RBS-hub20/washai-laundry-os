name = "washai-laundry-os"
main = "worker/index.js"
compatibility_date = "2024-01-01"

[vars]
ENV = "production"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# /api/* must reach the Worker; without this the SPA fallback would swallow it.
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "washai-db"
database_id = "6a421d6c-418e-4e13-aadb-71af36084db8"
